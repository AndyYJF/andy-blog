# Stage 10 content editing and automatic static rebuild control plane.
# It never publishes 80/443 and never starts the repository nginx service.
name: andy-blog-cms

services:
  rebuild-api:
    build:
      context: ./docker/rebuild-api
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      RUNTIME_DIR: /runtime/build
      WEBHOOK_SECRET_FILE: /run/secrets/webhook_secret
    volumes:
      - '${REBUILD_RUNTIME_DIR:?set durable rebuild runtime}:/runtime/build'
      - '${REBUILD_SECRET_FILE:?set webhook secret file}:/run/secrets/webhook_secret:ro'
    networks: [onepanel]
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:9000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5

  builder:
    profiles: [build]
    build:
      context: .
      dockerfile: docker/builder/Dockerfile
      args:
        SOURCE_REVISION: ${BUILDER_SOURCE_REVISION:-unknown}
    environment:
      TZ: Asia/Shanghai
      DB_HOST: ${TYPECHO_DB_HOST:?set Typecho database host}
      DB_USER: ${TYPECHO_RO_DB_USER:?set read-only Typecho database user}
      DB_PASSWORD: ${TYPECHO_RO_DB_PASSWORD:?set read-only Typecho database password}
      DB_NAME: ${TYPECHO_DB_NAME:?set Typecho database name}
    volumes:
      - '${PROD_WWW_ROOT:?set the 1Panel www deploy root}:/var/www/andy-y.cn'
      - '${REBUILD_RUNTIME_DIR:?set durable rebuild runtime}:/runtime/build'
    networks: [onepanel]
    security_opt:
      - no-new-privileges:true

  # i18n translation worker. Scoped DB user: SELECT on typecho_* contents,
  # SELECT/INSERT/UPDATE on the i18n_* tables only. No public ports.
  i18n-worker:
    build:
      context: .
      dockerfile: docker/i18n-worker/Dockerfile
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      DB_HOST: ${TYPECHO_DB_HOST:?set Typecho database host}
      DB_USER: ${TYPECHO_I18N_DB_USER:?set scoped i18n database user}
      DB_PASSWORD: ${TYPECHO_I18N_DB_PASSWORD:?set scoped i18n database password}
      DB_NAME: ${TYPECHO_DB_NAME:?set Typecho database name}
      DB_PREFIX: ${TYPECHO_DB_PREFIX:-typecho_}
      KIMI_BASE_URL: ${KIMI_BASE_URL:-https://api.moonshot.cn/v1}
      KIMI_MODEL: ${KIMI_MODEL:?set Kimi model name}
      KIMI_API_KEY_FILE: /run/secrets/kimi_api_key
      WEBHOOK_SECRET_FILE: /run/secrets/webhook_secret
    volumes:
      - '${KIMI_API_KEY_FILE:?set kimi api key file}:/run/secrets/kimi_api_key:ro'
      - '${REBUILD_SECRET_FILE:?set webhook secret file}:/run/secrets/webhook_secret:ro'
    networks: [onepanel]
    security_opt:
      - no-new-privileges:true
    depends_on:
      rebuild-api:
        condition: service_healthy

networks:
  onepanel:
    external: true
    name: ${ONEPANEL_NETWORK:-1panel-network}
